[package]
name = "aokira-engine"
version = "0.1.0"
edition = "2021"
description = "Deterministic Rust/WASM robotics kinematics, trajectory planning, collision detection, and production cycle simulation core for AoKira."
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
wasm-bindgen = "0.2"

[profile.release]
lto = true
opt-level = "s"
